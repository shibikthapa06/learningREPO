<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div  id="calculator">
        <input type="text" id="display" placeholder="0" disabled>
        <div id="buttons">
            <button id="number" onclick="appendValue('7')">7</button>
            <button id="number" onclick="appendValue('8')">8</button>
            <button id="number" onclick="appendValue('9')">9</button>
            <button id="operator" onclick="appendValue('/')">/</button>
            
            <button id="number" onclick="appendValue('6')">6</button>
            <button id="number" onclick="appendValue('5')">5</button>
            <button id="number" onclick="appendValue('4')">4</button>
            <button id="operator" onclick="appendValue('*')">*</button>
            <button id="number" onclick="appendValue('3')">3</button>
            <button id="number" onclick="appendValue('2')">2</button>
            <button id="number" onclick="appendValue('1')">1</button>
            <button id="operator" onclick="appendValue('+')">+</button>
            <button id="operator" onclick="appendValue('-')">-</button>
            <button id="number" onclick="appendValue('0')">0</button>
            <button id="operator" onclick="clearDisplay()">C</button>
            <button id="equals" onclick="calculate()">=</button>
        </div>

    </div>
    <script src="index.js"></script>
</body>
</html>
